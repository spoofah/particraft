[package]
name = "particraft"
description = "PartiCraft: a 3D particle system for EffectCraft (emitters, physics, sprites, lighting), as a native effect helper"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/spoofah/particraft"

# Build: cargo build --release  -> target/release/effectcraft-helper-particraft(.exe)
[workspace]

[lib]
name = "particraft"
path = "src/lib.rs"

[[bin]]
name = "effectcraft-helper-particraft"
path = "src/main.rs"

[dependencies]
rayon = "1"
serde_json = "1"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
