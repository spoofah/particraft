# Builds the release assets from the tag, so they can be checked against the source.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install   # the version in rust-toolchain.toml
      - run: cargo test --release --locked
      - run: cargo build --release --locked --bin effectcraft-helper-particraft
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target
          cp release/effectcraft-helper-particraft.exe .
          sha256sum effectcraft-helper-particraft.exe > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" effectcraft-helper-particraft.exe SHA256SUMS \
            --title "PartiCraft ${GITHUB_REF_NAME#v}" --notes "See the README for installation."
