# Builds the release assets from the tag, so they can be checked against the source.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: effectcraft-helper-particraft.exe
          - os: ubuntu-22.04   # older glibc, so the binary runs on more distributions
            file: effectcraft-helper-particraft
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install   # the version in rust-toolchain.toml
      - run: cargo test --release --locked
      - run: cargo build --release --locked --bin effectcraft-helper-particraft
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: target/release/${{ matrix.file }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x effectcraft-helper-particraft
          sha256sum effectcraft-helper-particraft.exe effectcraft-helper-particraft > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            effectcraft-helper-particraft.exe effectcraft-helper-particraft SHA256SUMS \
            --title "PartiCraft ${GITHUB_REF_NAME#v}" --notes "See the README for installation."
